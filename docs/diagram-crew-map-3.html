<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>
:root{color-scheme:light;--bg:#f6f7f8;--card:#fff;--line:#e3e7ea;--text:#12181b;--muted:#5b6770;--accent:#0e8fa0;--bad:#dc2626}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0c1114;--card:#131a1e;--line:#243036;--text:#eef3f5;--muted:#9aabb3;--accent:#45d2e2;--bad:#ff6257}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--bg);color:var(--text);font:18px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
form{width:100%;max-width:340px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:32px;display:grid;gap:16px;text-align:center}
h1{margin:0;font-size:28px;letter-spacing:-.02em}
p{margin:0;color:var(--muted);font-size:16px}
input{font:700 28px/1 ui-monospace,Menlo,monospace;letter-spacing:.4em;text-align:center;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--text);width:100%}
input:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button{font:700 16px/1 system-ui,sans-serif;padding:14px;border:0;border-radius:999px;background:var(--text);color:var(--bg);cursor:pointer}
button[disabled]{opacity:.6;cursor:wait}
.err{color:var(--bad)}
</style></head><body>

</form>

const un = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pin){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pin), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:un(P.s), iterations:P.n, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM", iv:un(P.i)}, key, un(P.c)));
}
function show(html){ document.open(); document.write(html); document.close(); }
const saved = (() => { try { return sessionStorage.getItem("rv_pin"); } catch(e){ return null; } })();
if (saved) unlock(saved).then(show).catch(() => {});
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const pin = document.getElementById("pin").value, go = document.getElementById("go"), err = document.getElementById("err");
  go.disabled = true; go.textContent = "Unlocking"; err.hidden = true;
  try { const html = await unlock(pin); try { sessionStorage.setItem("rv_pin", pin); } catch(x){} show(html); }
  catch(x){ err.hidden = false; go.disabled = false; go.textContent = "Open"; }
});
